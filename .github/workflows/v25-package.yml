name: Empacotar V25

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    if: github.head_ref == 'feat/chat-global-login-v25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patch
          files=(
            "backend/prisma/migrations/20260921100000_organization_chat/migration.sql"
            "backend/prisma/schema.prisma"
            "backend/src/controllers/workspace.controller.ts"
            "backend/src/routes/workspace.routes.ts"
            "backend/src/services/workspace.service.ts"
            "backend/src/validators/workspace.validator.ts"
            "frontend/src/components/AccessShowcaseCarousel.tsx"
            "frontend/src/pages/DashboardPage.tsx"
            "frontend/src/pages/LoginPage.tsx"
            "frontend/src/pages/RegisterPage.tsx"
            "frontend/src/pages/access-flow.css"
            "frontend/src/styles.css"
            "frontend/src/types/index.ts"
          )
          for file in "${files[@]}"; do
            mkdir -p "patch/$(dirname "$file")"
            cp "$file" "patch/$file"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: LicitaGestao-V25-code
          path: patch
          retention-days: 2
